[project]
name = "data-agent-service"
version = "0.0.1"
description = "Governed Data Agent: NL questions over Fabric Warehouses, grounded in OpenMetadata, fronted by APIM"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "mssql-python>=0.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
