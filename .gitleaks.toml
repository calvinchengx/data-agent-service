# Secret scanning.
#
# The history is clean: 134 commits, no findings, with every default rule
# armed. So this file is deliberately small -- an allowlist is a hole, and each
# one below is a generated artifact that is already gitignored rather than a
# class of secret we have decided to tolerate.
#
# In CI the allowlist is close to unnecessary: a fresh checkout contains none of
# these paths. It matters for `make secrets` on a developer's machine, where a
# working tree holds caches and reports full of real, short-lived tokens. Those
# ARE secrets; the point is that they are not in the repository, and a scanner
# that cries wolf about them is a scanner people stop running.
#
# Note what is NOT allowlisted: docs, the README, .env.example and the seeds.
# Seeded local credentials are published deliberately, but keeping those paths
# armed is what would catch a real credential pasted into a document by
# accident -- the most likely way one would ever land here.
[extend]
useDefault = true

# The golden tokens in the publisher contract are the ONE tracked exception.
# They exist so the Go and Python generators can be proved byte-identical, and
# they are signed with TABLEAU_SECRET = "not-a-real-connected-app-secret",
# checked in beside them -- tokens anyone can regenerate, authenticating to
# nothing.
#
# Keyed on the VALUE and not the path, which is the tighter of the two and was
# arrived at the hard way: an earlier version listed the path as well, with
# `condition = "AND"`, on the assumption that both had to match. A path match
# short-circuits, so that version silently allowed ANY jwt in that file. Caught
# by injecting a token with a real-looking issuer and watching it be swallowed
# -- 4 findings without the entry, 0 with it.
#
# The regex is the base64 of {"alg":"HS256","iss":"00000000...client", so it
# admits only tokens issued for the fake connected app, wherever they appear.
# A real token in the same file still fires. If the generator's header ever
# changes shape the match stops and gitleaks fires, which is the direction this
# should fail in.
[[allowlists]]
description = "Publisher contract goldens: JWTs issued for the fake connected app"
regexes = [
  '''^eyJhbGciOiJIUzI1NiIsImlzcyI6IjAwMDAwMDAw''',
]

[[allowlists]]
description = "Generated artifacts, none of them tracked by git"

paths = [
  # The pnpm content-addressable store for the docs site. Third-party package
  # contents, including test fixtures that legitimately contain JWTs.
  '''^\.pnpm-store/''',
  '''(^|/)node_modules/''',
  # k6 output and our own reports. The summaries embed the bearer tokens the
  # load run used: real tokens, minutes of life, never committed.
  '''^load/reports/''',
  '''^evals/reports/''',
  # What the seed wrote into the local stack: ids and the client secret it
  # provisioned in the emulated Key Vault.
  '''^seed/state\.json$''',
  # The built docs site.
  '''^website/dist/''',
  '''^_site/''',
]

# A DOCUMENT SLUG, captured as a secret. gitleaks' generic-api-key rule reads
# `auth` (in "an authz tier") as a keyword and takes the next quoted string as
# the value — which in website/scripts/sync-docs.ts is the next entry's key,
# `07-evaluation`. Entropy 3.55, and a filename.
#
# Keyed on the VALUE and anchored, like the goldens above and for the same
# reason: a path entry would disarm the whole file, and that file is where a
# real key would most plausibly be pasted. `\d\d-lowercase-with-hyphens` is a
# document in docs/, not a credential shape — nothing that could authenticate
# to anything matches it.
#
# Rewording the prose fixed the working tree but not the history, which is
# permanent and shared; this is what makes `gitleaks git .` pass without
# rewriting a branch five sessions are committing to.
#
# Canary: with this entry in place, an `sk_live_...` string added to that same
# file still fires. Verified, both ways.
[[allowlists]]
description = "Document slugs in the docs-site generator, not credentials"
regexes = [
  '''^\d{2}-[a-z][a-z-]*$''',
]
