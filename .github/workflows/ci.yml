name: CI

# A push to a PR branch would otherwise fire both events and run every job
# twice for the same commit. Filtering push to main leaves branch commits
# covered by the pull_request run and main commits by the push run.
on:
  push:
    branches: [main]
  pull_request:

# Supersede PR runs, never main runs: a main commit's run is the record of what
# main was, while only a PR's newest commit is under review.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which lane may this commit take? A path CLASSIFIER rather than a path
  # filter: `paths-ignore` cannot see that a page was DELETED, and a page that
  # disappears can break a link another page or check asserts. Ported from
  # fabric-emulator, which solved this first -- see scripts/docs_only_change.py.
  changes:
    name: Docs-only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The classifier diffs against a base commit, which a shallow clone
          # does not have.
          fetch-depth: 0
      # The self-test runs BESIDE the real classification, every time. A
      # classifier that stopped matching anything would answer `false` forever
      # -- safe, plausible and silently useless -- so a case list asserting
      # both directions is the only thing that would notice.
      - run: python3 scripts/docs_only_change.py --self-test
      - run: python3 scripts/docs_only_change.py --explain
      - id: classify
        env:
          # Three-dot: what this ref ADDED since it diverged, never what main
          # did underneath it.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A force push and a branch's first commit both give the null sha.
          # Neither is a docs change; both run everything.
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base '$BASE' is not a commit here; running everything"
            exit 0
          fi
          git diff --name-status "$BASE...$HEAD_SHA" | python3 scripts/docs_only_change.py

  # Everything that needs no running stack, so a mistake in a linter or a guard
  # is reported in a minute rather than after a fifteen-minute bring-up.
  quality:
    name: Lint, types and guards
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Tags, because check_version reads the newest one and REFUSES to pass a
      # checkout that has none -- a shallow clone quietly skipping the check is
      # the failure it exists to prevent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: install dependencies
        id: deps
        run: uv sync --all-groups --frozen

      # Every gate below runs even when an earlier one failed. They are
      # independent checks, and GitHub's default stops the job at the first
      # failure -- so one red `ty` skipped EIGHT gates, and a skipped step
      # reads as "not the problem" rather than "not checked". Whoever fixes
      # the type error then discovers the next gate, one round trip at a time.
      # Guarded on `deps` because a failed `uv sync` makes all of them
      # meaningless noise rather than eight findings.

      # LINT_MODE=host: the runner already has the toolchain, and building the
      # tools image to lint would trade three minutes for nothing.
      - name: ruff
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run ruff check . && uv run ruff format --check .
      - name: ty
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run ty check
      # ty reports a signature/body contradiction only where a CALLER violates
      # it, so one can sit in the tree for weeks and then fail the build as
      # soon as somebody writes the obvious test. This checks the definition.
      - name: annotations agree with their bodies
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run python -m scripts.check_annotations
      # docs/witnesses.json exists so one number has one source. It did not
      # stop the number being copied into prose, where four copies drifted.
      - name: witness totals in prose match the manifest
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run python -m scripts.check_counts
      # Both of these were in `make lint` and in no CI job, which is the same
      # hole as a check nobody runs -- it holds only for whoever remembers.
      # The nav one has already been paid for: a sidebar entry for a page that
      # was never committed took the docs site down, and this is the check that
      # would have said so. It reads `git ls-files`, not the filesystem, which
      # is exactly why it catches that case.
      - name: the docs sidebar matches committed pages
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python3 scripts/check_docs_nav.py
      - name: pull commands name the released version
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run python -m scripts.check_version
      - name: python tests, with the coverage floor
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Same targets and floor as `make coverage-python`; run directly rather
        # than through the tools container, because this job has no stack and
        # does not need one to measure unit coverage.
        run: >
          uv run pytest tests -q
          --cov=agent --cov=promoter --cov=publisher --cov=services/warehouse-query-py
          --cov-report=term-missing --cov-fail-under=90

      # Discipline rule 2, mechanically: no emulator-only code path, and no
      # development-only surface without a stated reason.
      - name: no emulator-only code paths
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: sh scripts/check-discipline.sh
      - name: no development-only paths
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run python -m scripts.check_prod_paths --strict

      # The production template must stay coherent even though nothing here
      # deploys: an incoherent one is discovered at the worst moment otherwise.
      - name: production settings are coherent
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Against the PRODUCTION template, which is what the step name claims.
        # Run against .env.example it proves nothing about production and
        # fails on ids that only exist after seeding.
        run: cp .env.prod.example .env.prod && uv run python -m scripts.preflight --env prod --offline

  go:
    name: Go executor
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/warehouse-query-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: setup
        with:
          go-version-file: services/warehouse-query-go/go.mod
          cache-dependency-path: services/warehouse-query-go/go.sum
      # No libduckdb here: the DuckDB adapter is behind `-tags duckdb` and is
      # not built, so nothing in this job needs it. The adapter is therefore
      # unexercised by CI until the strategy for embedded engines is settled --
      # said plainly in docs/16-go-parity.md rather than left to be discovered.
      # Independent gates, run even after an earlier one fails -- same
      # reasoning as the quality job above. A vet error masking the coverage
      # floor and the verdict diff costs three round trips to learn what one
      # run already knew.
      - name: go vet
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: go vet ./...
      - name: go test, with the coverage floor
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Same measurement as `make coverage-go`, on the runner's own toolchain.
        run: |
          go test ./... -coverprofile=cover.out
          go tool cover -func=cover.out | tail -1
          pct=$(go tool cover -func=cover.out | tail -1 | awk '{gsub(/%/,"",$NF); print $NF}')
          awk -v p="$pct" 'BEGIN { if (p+0 < 90) { printf "go coverage %s%% is below the 90%% floor\n", p; exit 1 } }'
      - uses: golangci/golangci-lint-action@v9
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        with:
          version: v2.13.1
          working-directory: services/warehouse-query-go
      # The Go guard is held to the Python guard's recorded verdicts, for SQL
      # and for HTTP alike. Those records are only worth anything if they still
      # describe the guard, so both are regenerated and diffed: a Python change
      # that moves a verdict without the Go side following it fails here rather
      # than in production.
      #
      # uv is installed once, as its own step, rather than inside one of them.
      # It used to be installed inside the SQL diff, so adding the HTTP diff
      # ABOVE it gave that step no uv and exit 127 -- a setup step that is a
      # side effect of another step works right up until something is put in
      # front of it.
      - name: uv, for the two verdict diffs
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: .
        run: pipx install uv || pip install uv
      - name: the recorded HTTP verdicts still describe the Python guard
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: .
        run: |
          cp services/contract/http_corpus.json /tmp/http_corpus.json
          uv run python services/contract/gen_http_corpus.py
          diff /tmp/http_corpus.json services/contract/http_corpus.json \
            && echo "the recorded HTTP verdicts are the Python guard's"
      - name: the recorded verdicts still describe the Python guard
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: .
        run: |
          cp services/contract/guard_corpus.json /tmp/guard_corpus.json
          uv run python services/contract/gen_guard_corpus.py
          diff /tmp/guard_corpus.json services/contract/guard_corpus.json \
            && echo "the recorded verdicts are the Python guard's"

  publisher-contract:
    name: Publisher contract
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: publisher-go/go.mod
          cache-dependency-path: publisher-go/go.mod
      - uses: astral-sh/setup-uv@v7
      # The recorded artefacts are only worth anything if they still describe
      # the Python generator, so regenerate and diff first -- a change to
      # model.py or report.py that moves a byte fails here rather than
      # silently making the Go side wrong about what it is held to.
      - name: the recorded artefacts still describe the Python generator
        run: |
          uv run python publisher/contract/gen_cases.py
          git diff --exit-code -- publisher/contract/cases.json \
            && echo "the recorded artefacts are the Python generator's"
      - name: go vet
        working-directory: publisher-go
        run: go vet ./...
      - name: the Go generator produces the same bytes
        working-directory: publisher-go
        run: |
          go test ./... -coverprofile=cover.out
          go tool cover -func=cover.out | tail -1
          pct=$(go tool cover -func=cover.out | tail -1 | awk '{gsub(/%/,"",$NF); print $NF}')
          awk -v p="$pct" 'BEGIN { if (p+0 < 90) { printf "publisher-go coverage %s%% is below the 90%% floor\n", p; exit 1 } }'
      # The committed corpus replays under `go test` above; this looks for the
      # NEXT one. Both properties here have already earned their keep -- the
      # self-join binding and the Canonical fixed point were found this way,
      # not by anyone reading the code.
      - name: a short fuzz over the generator's properties
        working-directory: publisher-go
        run: |
          go test -run=XXX -fuzz=FuzzCanonicalIsAFixedPoint -fuzztime=40s .
          go test -run=XXX -fuzz=FuzzTableOfNeverGuesses -fuzztime=40s .

  # The DuckDB adapter is behind `-tags duckdb`, so the job above never
  # compiles it. Without this one the adapter would be written, asserted, and
  # exercised by nothing -- and its read-only test would run only where someone
  # happens to have libduckdb installed, which is the state of a laptop rather
  # than of the code.
  go-duckdb:
    name: Go executor (DuckDB adapter)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/warehouse-query-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/warehouse-query-go/go.mod
          cache-dependency-path: services/warehouse-query-go/go.sum
      - name: libduckdb
        working-directory: .
        env:
          DUCKDB_VERSION: v1.5.4
        run: |
          curl -sSfL "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/libduckdb-linux-amd64.zip" -o /tmp/libduckdb.zip
          sudo unzip -j -o /tmp/libduckdb.zip libduckdb.so -d /usr/local/lib
          sudo ldconfig
      - run: go vet -tags duckdb ./...
      # The tests skip themselves when libduckdb cannot be loaded, which is the
      # right behaviour locally and useless here: a job that lets them skip
      # would report success having proved nothing. So a skip is a failure.
      - name: the DuckDB tests run rather than skip
        run: |
          set -o pipefail
          go test -tags duckdb -run DuckDB -v ./... 2>&1 | tee /tmp/duckdb.log
          if grep -q '^--- SKIP' /tmp/duckdb.log; then
            echo "::error::a DuckDB test skipped — libduckdb was not loaded, so this job proved nothing"
            exit 1
          fi
          grep -c '^--- PASS' /tmp/duckdb.log
      - run: go test -tags duckdb ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: services/warehouse-query-go
          args: --build-tags duckdb

  infra:
    name: Infrastructure compiles
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # One definition covers the resources AND the app registration, which
      # ARM cannot express. All three steps are offline -- `init
      # -backend=false` only fetches providers, and nothing here contacts Azure
      # or touches state.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: terraform init
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir=infra/terraform validate

  # The whole thing, from nothing: bring the stack up, seed it, and run every
  # witness. This is the job that would notice a fresh clone cannot reach green.
  stack:
    name: Full stack witnesses
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: free disk for the images
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /
      - name: bring up, seed, verify
        run: make stack
      # `make conformance` now recreates the executor for each implementation
      # and refuses to run unless the container it is talking to is the one it
      # asked for. The step was labelled "both implementations" while running
      # against whichever happened to be up, which is how a PostgreSQL gap
      # survived two phases behind a green contract.
      - name: executor contract, both implementations
        run: make conformance
      # The witnesses badge is generated from docs/witnesses.json by the docs
      # site, which never runs the stack. This is what stops that number
      # drifting away from what the suite actually witnesses.
      - name: the witnesses badge matches this run
        run: make witnesses-check
      - name: the coverage badges match a real run
        # Needs both suites, so it belongs here rather than in `quality` or
        # `go`: `make coverage-*` runs each through its own container, and this
        # is the only job that has them.
        run: python3 scripts/coverage_manifest.py --check
      # When the manifest IS stale, the useful thing is the correct one. This
      # runs only on failure and uploads what this run actually witnessed, so
      # refreshing the badge is downloading a file rather than reproducing a
      # full stack locally.
      - name: the manifest this run would have written
        if: failure()
        run: make witnesses-manifest || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: witnesses-manifest
          path: docs/witnesses.json
          if-no-files-found: warn
      - name: what failed
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 80 warehouse-query openmetadata apim-emulator || true
