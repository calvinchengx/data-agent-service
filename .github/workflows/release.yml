# Continuous delivery: a tag publishes both executor images and a GitHub
# Release. Both implementations are published because both are real -- the
# contract in services/contract/openapi.json is what they answer to, and
# choosing between them is a deployment decision, not a fork.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v0.1.0); dry-run only, nothing is pushed'
        required: true

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push images to GHCR

jobs:
  # A tag must not publish an image whose tests never ran. This is the same
  # gate CI applies on every push, repeated here because a tag can be pushed
  # to any commit, including one CI never saw.
  gate:
    name: Tests and guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest tests -q
      - run: sh scripts/check-discipline.sh
      - run: uv run python -m scripts.check_prod_paths --strict
      # The tagged commit must describe itself: `uv version` writes the
      # number, this proves it was written. Setting it during the build
      # instead would leave main saying the old one, and committing it back
      # from CI would put the truth on a commit the tag does not point at.
      - name: pyproject.toml claims the tag being released
        if: github.ref_type == 'tag'
        run: uv run python -m scripts.check_version --release "${{ github.ref_name }}"

  go:
    name: Go executor tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/warehouse-query-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/warehouse-query-go/go.mod
          cache-dependency-path: services/warehouse-query-go/go.sum
      - run: go vet ./...
      - run: go test ./...

  images:
    name: ${{ matrix.executor }} executor → GHCR
    needs: [gate, go]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        executor: [py, go]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          # One package per implementation, nested under the repository, so
          # promoter/ and publisher/ can join them without renaming anything.
          images: ghcr.io/${{ github.repository }}/executor-${{ matrix.executor }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/warehouse-query-${{ matrix.executor }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          # workflow_dispatch is a dry run: it proves the images build for both
          # architectures without publishing anything under a version number
          # that no tag stands behind.
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  release:
    name: GitHub Release
    needs: images
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Images"
            echo
            echo '```sh'
            echo "docker pull ghcr.io/${{ github.repository }}/executor-py:${TAG#v}"
            echo "docker pull ghcr.io/${{ github.repository }}/executor-go:${TAG#v}"
            echo '```'
            echo
            echo "Both answer the same contract (\`services/contract/openapi.json\`)."
            echo "Choose with \`DAS_EXECUTOR=py|go\`; see docs/adr/0001-two-executors.md."
          } > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --generate-notes
