# CodeQL — advanced (in-repo) setup rather than the repository's Default setup,
# so the language list is a decision recorded here rather than something
# inferred.
#
# Everything scanned is first-party code we author and ship:
#   - python                 the executor, agent, seeds, evals, harnesses
#   - go                     the second executor
#   - javascript-typescript  the docs site and its build scripts
#   - actions                these workflows
#
# Python matters most here and is the reason this is worth running: it is the
# default executor, and it is the code that validates a bearer token, performs
# the on-behalf-of exchange and parses caller-supplied SQL.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC

# Superseding a pull-request run costs nothing. Superseding a run on main does:
# a cancelled CodeQL job still uploads its SARIF, flagged as an unsuccessful
# execution with zero results, and that errored analysis then becomes the most
# recent one for its category. A burst of commits would quietly replace real
# findings with empty ones. So main runs to completion; only PR pushes cancel.
# THE DEFAULT TOKEN IS NOT READ-ONLY, so say what this workflow may do.
# CodeQL's `actions/missing-workflow-permissions` flags a job that sets none:
# it inherits whatever the repository default is, which is a write token in
# many configurations and is never what a build needs. Declared here rather
# than per job, so a job added later cannot forget it; a job that genuinely
# needs more escalates in its own `permissions:` block, which overrides this.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The same classifier ci.yml uses, and for the same reason: nothing here
  # analyses a markdown file. A job rather than `paths-ignore`, so the
  # repository has ONE answer to "is this a docs change" -- self-tested, with
  # a delete or a rename disqualifying it.
  changes:
    name: Docs-only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The classifier diffs against a base commit, which a shallow clone
          # does not have.
          fetch-depth: 0
      # The self-test runs BESIDE the real classification, every time. A
      # classifier that stopped matching anything would answer `false` forever
      # -- safe, plausible and silently useless -- so a case list asserting
      # both directions is the only thing that would notice.
      - run: python3 scripts/docs_only_change.py --self-test
      - run: python3 scripts/docs_only_change.py --explain
      - id: classify
        env:
          # Three-dot: what this ref ADDED since it diverged, never what main
          # did underneath it.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A force push and a branch's first commit both give the null sha.
          # Neither is a docs change; both run everything.
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base '$BASE' is not a commit here; running everything"
            exit 0
          fi
          git diff --name-status "$BASE...$HEAD_SHA" | python3 scripts/docs_only_change.py

  # Everything that needs no running stack, so a mistake in a linter or a guard
  # is reported in a minute rather than after a fifteen-minute bring-up.
  analyze:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      # The Go module lives beside its source rather than at the repository
      # root, which autobuild does not find. A manual build in the right
      # directory is deterministic; autobuild here would be a guess.
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: services/warehouse-query-go/go.mod
          cache-dependency-path: services/warehouse-query-go/go.sum
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'go'
        run: go build ./...
        working-directory: services/warehouse-query-go
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
