# data-agent-service — local stack on the emulator family.
#
# Every dependency is a PUBLISHED image, pinned (discipline rule 1: emulators
# and OpenMetadata are used as-is — no build:, no forks). Only this repo's own
# services are built from source.
#
# Issuer invariant (the family's one rule): entra advertises PUBLIC_ORIGIN and
# every peer repeats the same issuer string verbatim.
#
#   make up       # full stack: identity + fabric warehouse + OpenMetadata + APIM
#   make status   # is it usable?
#   make down     # stop; `make clean` also drops volumes
#
# Memory: ~14 GB (SQL Server 2 GB cap, OpenSearch 1 GB, OM ~2 GB, fabric, apim).

x-issuer: &issuer "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
x-jwks:   &jwks   "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/discovery/v2.0/keys"

services:
  # ---------------------------------------------------------------- identity
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:-0.9.0}
    environment:
      ORIGIN_MODE: compat
      PUBLIC_ORIGIN: "https://entra-emulator:8443"
    ports:
      - "${ENTRA_PORT:-8443}:8443"
    volumes:
      - entra-data:/app/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  keyvault-emulator:
    image: ghcr.io/calvinchengx/azure-keyvault-emulator:${KEYVAULT_EMULATOR_VERSION:-0.7.0}
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "${KEYVAULT_PORT:-8444}:8444"
    environment:
      KV_ENTRA_ISSUER: *issuer
      KV_ENTRA_TLS_INSECURE: "true"
      KV_DATA_DIR: ""
      # Authorization handed to the emulator's own surface; ARM role
      # assignments are not part of this stack's story.
      KV_ARM_URL: ""
    healthcheck:
      test: ["CMD", "/usr/local/bin/azure-keyvault-emulator", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  arm-emulator:
    image: ghcr.io/calvinchengx/arm-emulator:${ARM_EMULATOR_VERSION:-0.4.1}
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "${ARM_PORT:-8445}:8445"
    environment:
      ARM_ENTRA_ISSUER: *issuer
      ARM_ENTRA_JWKS_URL: *jwks
      ARM_ENTRA_TLS_INSECURE: "true"
      ARM_TENANT_ID: "6f89cf12-978b-4d23-ac18-9ef0c127cf87"
      ARM_SUBSCRIPTION_ID: "6082bfda-63d0-46f4-8272-ae9195139feb"
    healthcheck:
      test: ["CMD", "/usr/local/bin/arm-emulator", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------ fabric
  # The warehouse engine behind fabric-emulator's TDS front. Digest-pinned as
  # fabric-emulator pins it; amd64-only upstream.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Str0ng!Passw0rd", "-C", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  fabric-emulator:
    image: ghcr.io/calvinchengx/fabric-emulator:${FABRIC_EMULATOR_VERSION:-0.32.0}
    depends_on:
      entra-emulator:
        condition: service_healthy
      arm-emulator:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    ports:
      - "${FABRIC_PORT:-9443}:9443"   # api.fabric + onelake + portal
      - "${FABRIC_TDS_PORT:-1433}:1433" # warehouse T-SQL (FedAuth)
    environment:
      FABRIC_ENTRA_ISSUER: *issuer
      FABRIC_ENTRA_JWKS_URL: *jwks
      FABRIC_ENTRA_TLS_INSECURE: "true"
      FABRIC_AKV_VAULT_HOST: "keyvault-emulator:8444"
      FABRIC_ARM_URL: "https://arm-emulator:8445"
      FABRIC_DATA_DIR: "${FABRIC_DATA_DIR-/data}"
      FABRIC_TENANT_ADMINS: "${FABRIC_TENANT_ADMINS:-00d88624-f0d7-46f6-a641-6232c2608928}"
      FABRIC_SQL_TDS_ADDR: ":1433"
      FABRIC_WAREHOUSE_SQL_URL: "server=sqlserver;user id=sa;password=Str0ng!Passw0rd;encrypt=disable;dial timeout=90;connection timeout=90"
    volumes:
      - fabric-data:/data
    # Fabric encodes the WORKSPACE in a warehouse's SQL host
    # (`<workspace>.datawarehouse.fabric.microsoft.com`) and a client names the
    # database by display name. The emulator echoes the REST request's host into
    # `connectionString` and resolves the workspace from the login server name
    # (by id or name), so one DNS alias per seeded workspace lets a container use
    # the documented, production-identical path with no override. Add one alias
    # per workspace you seed.
    networks:
      default:
        aliases:
          - contoso-analytics.datawarehouse.fabric.microsoft.com
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------ openmetadata
  # OpenMetadata 1.13.2 exactly as fabric-emulator's governance profile runs
  # it (Postgres + OpenSearch; OpenSearch because semantic search needs it).
  om-postgresql:
    image: docker.getcollate.io/openmetadata/postgresql:1.13.2
    command: "--work_mem=10MB"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - om-db-data:/var/lib/postgresql/data
    healthcheck:
      test: psql -U postgres -tAc 'select 1' -d openmetadata_db
      interval: 15s
      timeout: 10s
      retries: 10

  om-opensearch:
    image: opensearchproject/opensearch:3.4.0
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms1024m -Xmx1024m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    volumes:
      - om-search-data:/usr/share/opensearch/data
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10

  om-migrate:
    image: docker.getcollate.io/openmetadata/server:1.13.2
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment: &om-env
      DB_HOST: om-postgresql
      DB_PORT: "5432"
      DB_SCHEME: postgresql
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      SEARCH_TYPE: opensearch
      ELASTICSEARCH_HOST: om-opensearch
    depends_on:
      om-postgresql:
        condition: service_healthy
      om-opensearch:
        condition: service_healthy

  openmetadata:
    image: docker.getcollate.io/openmetadata/server:1.13.2
    ports:
      - "${OM_PORT:-8585}:8585"
    environment: *om-env
    depends_on:
      om-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 20

  # -------------------------------------------------------------------- apim
  # Container listens on 8445 (arm's port); host side moves to 8446 as the
  # family BOM does.
  apim-emulator:
    image: ghcr.io/calvinchengx/azure-apim-emulator:${APIM_EMULATOR_VERSION:-0.4.0}
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "${APIM_PORT:-8446}:8445"
    environment:
      APIM_ENTRA_ISSUER: *issuer
      APIM_ENTRA_JWKS_URL: *jwks
      APIM_ENTRA_TLS_INSECURE: "true"
      APIM_DATA_DIR: "${APIM_DATA_DIR-/data}"
    volumes:
      - apim-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/azure-apim-emulator", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  # A stand-in for a model API, so the gateway's cost controls can be
  # witnessed without a model credential. Never in the service's request path:
  # the `llm` API points here only when DAS_LLM_BACKEND says so.
  llm-stub:
    image: python:3.12-slim
    command: ["python", "/app/main.py"]
    volumes:
      - ./services/llm-stub:/app:ro
    environment:
      PORT: "8095"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8095/health',timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ------------------------------------------------------------- tools (ours)
  # Seeds, e2e, evals, load — run INSIDE the network so they reach every
  # dependency the way the service does:  docker compose run --rm tools <cmd>
  tools:
    profiles: [tools]
    # The harnesses talk to these, so they wait for them to be HEALTHY rather
    # than merely started. `docker compose up -d` returns once a container is
    # running, and OpenMetadata takes a further minute or two to answer — which
    # is invisible to anyone who seeds by hand a few minutes later, and fails
    # every time in CI.
    depends_on:
      entra-emulator:
        condition: service_healthy
      keyvault-emulator:
        condition: service_healthy
      fabric-emulator:
        condition: service_healthy
      openmetadata:
        condition: service_healthy
      apim-emulator:
        condition: service_healthy
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
    env_file: ${ENVFILE:-.env}
    volumes:
      - ./:/app:rw
      - tools-venv:/app/.venv
    working_dir: /app

  # --------------------------------------------------------------- postgres
  # The second engine, and the one that makes `authz_tier` concrete. Azure
  # Database for PostgreSQL accepts an Entra token as the password, so a source
  # there is `user`-tier; a plain PostgreSQL has no such trust, is queried as
  # the service, and every caller looks identical to it. That is weaker, and
  # having it in the stack means the weaker path is exercised rather than
  # described.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: das
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-das-local-only}
      POSTGRES_DB: support
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U das -d support"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------- data-agent-service (ours)
  # The executor. Reaches Fabric's TDS front as the ASKING USER (OBO) and holds
  # no secret in its environment: its managed identity is discovered through the
  # standard IDENTITY_ENDPOINT/IDENTITY_HEADER contract, and any secret it needs
  # comes from Key Vault.
  warehouse-query:
    build:
      context: .
      # DAS_EXECUTOR=py|go picks the implementation. Both satisfy the same
      # contract (services/contract/openapi.json), proved by the same suite
      # (services/conformance/run.py), so everything above this service is
      # unchanged by the choice.
      dockerfile: services/warehouse-query-${DAS_EXECUTOR:-py}/Dockerfile
    depends_on:
      entra-emulator:
        condition: service_healthy
      fabric-emulator:
        condition: service_healthy
      keyvault-emulator:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${EXECUTOR_PORT:-8090}:8090"
    env_file: ${ENVFILE:-.env}
    environment:
      # Managed identity, App Service protocol — the same two variables the
      # platform sets in Azure.
      IDENTITY_ENDPOINT: "https://entra-emulator:8443/msi/token"
      IDENTITY_HEADER: "${DAS_MI_HEADER:-managed-identity-secret}"
      # The RESOURCE, as a client sees it, is the MCP endpoint on the gateway.
      # RFC 9728 §3.1 puts the well-known segment between the host and that
      # path, so this is what makes the 401 challenge name a URL the gateway
      # actually serves (seed/apim.py publishes the scoped operation).
      DAS_PUBLIC_BASE_URL: "${DAS_APIM_BASE:-https://apim-emulator:8445}/warehouse/mcp"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health',timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  tools-venv:
  postgres-data:
  entra-data:
  fabric-data:
  om-db-data:
  om-search-data:
  apim-data:
